# This file is published at the GitHub repository root.
# The database is already provisioned in My Creations; set its INTERNAL URL
# in the service environment. No credentials are stored in this repository.
services:
  - type: web
    name: vortexplots
    runtime: node
    plan: free
    region: singapore
    rootDir: VortexPlots
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm build:render
    startCommand: corepack pnpm start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
